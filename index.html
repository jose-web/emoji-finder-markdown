<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emoji finder markdown</title>
    <script>
        // Dark by default; remember the viewer's choice.
        try {
            const saved = localStorage.getItem("theme")
            if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved
        } catch (e) { }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="https://github.githubassets.com/images/icons/emoji/unicode/1f50e.png?v8"
        type="image/x-icon">
</head>

<body>
    <header class="topbar">
        <svg class="logo" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="2" />
            <circle cx="11" cy="13" r="2" fill="currentColor" />
            <circle cx="21" cy="13" r="2" fill="currentColor" />
            <path d="M10 19c1.5 2.5 3.5 3.5 6 3.5s4.5-1 6-3.5" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" />
        </svg>
        <div class="crumbs">
            <span>emoji-finder</span>
            <span class="sep">/</span>
            <strong>markdown</strong>
            <span class="pill">Public</span>
        </div>
        <button id="theme-toggle" class="btn icon-btn" type="button" aria-label="Toggle light and dark theme">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4" />
                <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
        </button>
    </header>

    <div class="layout">
        <main class="content">
            <div class="search-row">
                <label class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7" />
                        <line x1="16.5" y1="16.5" x2="21" y2="21" />
                    </svg>
                    <span class="sr-only">Search emojis</span>
                    <input id="search" type="text" placeholder="Search emojis…" autocomplete="off" autofocus>
                </label>
                <button id="random" class="btn" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="16 3 21 3 21 8" />
                        <line x1="4" y1="20" x2="21" y2="3" />
                        <polyline points="21 16 21 21 16 21" />
                        <line x1="15" y1="15" x2="21" y2="21" />
                        <line x1="4" y1="4" x2="9" y2="9" />
                    </svg>
                    Random
                </button>
            </div>

            <div class="box">
                <div class="box-header">
                    <div class="count-wrap">
                        <span id="count">Loading emojis…</span>
                        <span id="ai-badge" class="topic"></span>
                    </div>
                    <span class="hint">Click to copy · <strong>+</strong> adds it to the comment</span>
                </div>
                <div id="emojis"></div>
            </div>
        </main>

        <aside class="sidebar">
            <section class="about">
                <h2>About</h2>
                <p>Find GitHub emoji shortcodes for issues, pull requests and READMEs — including the GitHub-only
                    ones.</p>
                <div class="topics">
                    <span class="topic">markdown</span>
                    <span class="topic">emoji</span>
                    <span class="topic">shortcodes</span>
                    <span class="topic">ai-search</span>
                </div>
            </section>

            <section class="composer-section">
                <h2>Try it in a comment</h2>
                <div class="composer">
                    <div class="composer-tabs" role="tablist">
                        <button id="tab-write" class="wt active" type="button" role="tab" aria-selected="true"
                            aria-controls="draft">Write</button>
                        <button id="tab-preview" class="wt" type="button" role="tab" aria-selected="false"
                            aria-controls="preview">Preview</button>
                    </div>
                    <div class="composer-body">
                        <label class="sr-only" for="draft">Comment</label>
                        <textarea id="draft" rows="5" spellcheck="false"></textarea>
                        <div id="preview" role="tabpanel" hidden></div>
                    </div>
                    <div class="composer-actions">
                        <button id="reset-draft" class="btn btn-sm" type="button">Reset</button>
                        <button id="copy-draft" class="btn btn-sm btn-primary" type="button">Copy markdown</button>
                    </div>
                </div>
            </section>
        </aside>
    </div>

    <button id="to-top" class="btn" type="button" aria-label="Back to top" title="Back to top">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="19" x2="12" y2="5" />
            <polyline points="5 12 12 5 19 12" />
        </svg>
    </button>

    <div id="toast" role="status" aria-live="polite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 6 9 17 4 12" />
        </svg>
        <span id="toast-text"></span>
    </div>

    <script src="script.js"></script>
</body>

</html>
